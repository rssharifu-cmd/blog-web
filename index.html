<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="impact-site-verification" value="9f11eb9a-f80c-421e-9f89-3182dbeca181" />
    <script>
      (function() {
        try {
          var targets = [
            typeof window !== 'undefined' ? window : null,
            typeof self !== 'undefined' ? self : null,
            typeof globalThis !== 'undefined' ? globalThis : null
          ];
          targets.forEach(function(target) {
            if (!target) return;
            var currentFetch = target.fetch ? target.fetch.bind(target) : null;
            try {
              Object.defineProperty(target, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(fn) {
                  currentFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e) {}
          });
        } catch (e) {}
      })();
    </script>
    
    <!-- DNS preconnect to eliminate server connection latency on Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Preload font CSS stylesheet for outstanding render performance -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
